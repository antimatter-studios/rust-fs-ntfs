# The Linux test VM (fs-linux-test-harness, the sibling `chore siblings`
# checks out at LINUX_HARNESS_REF): where the kernel's own ntfs3 driver
# reads what this crate writes (`chore test:kernel`, #486). Nothing here
# mounts an image on the host.
[project]
name = "rust-fs-ntfs"

[setup]
script = "scripts/vm-setup.sh"

[share]
dir = ".vm-share"

[vm]
profile = "ntfs3"
