[package]
name = "fs-ntfs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Fuzz harness for the three byte-decoding helpers most likely to
# panic on a crafted NTFS image: data-run decoder, EA decoder, and
# attribute iterator. All three take raw bytes and walk them per the
# NTFS on-disk structure docs (Windows Internals 7th ed., MS-FSCC) —
# the kind of code where one off-by-one can sit unnoticed forever.
#
# Run a single target:
#   cargo +nightly fuzz run decode_runs
# Or all targets in turn:
#   for t in decode_runs decode_eas iter_attributes; do
#       cargo +nightly fuzz run $t -- -max_total_time=60
#   done

[dependencies]
libfuzzer-sys = "0.4"
rust-fs-ntfs = { path = ".." }

[[bin]]
name = "decode_runs"
path = "fuzz_targets/decode_runs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_eas"
path = "fuzz_targets/decode_eas.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iter_attributes"
path = "fuzz_targets/iter_attributes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "boot_sector"
path = "fuzz_targets/boot_sector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_block"
path = "fuzz_targets/index_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decompress_unit"
path = "fuzz_targets/decompress_unit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_fixup"
path = "fuzz_targets/apply_fixup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured"
path = "fuzz_targets/structured.rs"
test = false
doc = false
bench = false

# Overflow checks and debug assertions in the build the fuzzer runs (#483).
# A release build wraps an overflowing multiplication silently, and two of
# the three panics the structure-aware explorer first found were exactly
# that.
[profile.release]
debug-assertions = true
overflow-checks = true
