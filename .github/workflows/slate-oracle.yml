name: Slate checker oracle (advisory)
# Slate's offline checker beside Windows chkdsk, on the same bytes (#687,
# part of #580). Slate is a third NTFS implementation: it can show where two
# implementations read a volume differently, and only Windows says which one
# is right. So Windows formats the controls, our mkfs.ntfs formats the rest,
# chkdsk grades every image, and Slate's read-only check is then run on the
# very images chkdsk graded. A disagreement fails this workflow and keeps its
# image in the artifact.
#
# ADVISORY. It is not in .github-guard's required contexts and does not run
# in the merge queue. #694 makes the stable part of it required, after a
# measured run of reliability; until then it reports, it does not gate.
on:
  pull_request:
    paths:
      - .github/workflows/slate-oracle.yml
      - scripts/slate-oracle.sh
      - tests/scripts/slate-oracle.sh
      - tests/slate-disagreements.tsv
      - tests/slate-writes.tsv
      - tests/scripts/slate-write-workflow.sh
      - scripts/slate-read-compare.py
      - tests/scripts/slate-read-compare.sh
      - tests/scripts/slate-writer-capture.sh
      - tests/scripts/slate-namespace-capture.sh
      - tests/scripts/slate-stream-metadata-capture.sh
      - scripts/fs-windows-test-harness/run-host-steps
      - scripts/cli-oracle.sh
      - fs-windows-test-harness.toml
      - test-matrix.json
      - test-disks/build-slate-oracle-cases.ps1
      - test-disks/capture-slate-windows-manifest.ps1
      - tests/scripts/slate-windows-manifest.ps1
      - test-disks/capture-slate-windows-allocation.ps1
      - tests/scripts/slate-windows-allocation.ps1
      - chores.yml
      - src/**
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writer-cases:
    name: Capture matrix data writes before Windows mounts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Build the release CLI
        run: cargo build --locked --release --features cli --bin rust-fs-ntfs
      # cli-oracle.sh writes named streams and EAs through the harness
      # binary: fs.ntfs reads them but has no writer.
      - name: Build the harness binary
        run: cargo build --locked --release --features harness --bin rust-ntfs
      # Data writes (#827), then one recipe per namespace family (#828):
      # mkdir -p, mv, rm of a hard link, and rm then rmdir; the link recipe
      # also writes the symbolic link, a reparse point. Then the stream and
      # metadata writes (#829): twelve named streams and an EA spilling into
      # an $ATTRIBUTE_LIST, and a split $DATA with its own streams and EA.
      - name: Capture the existing data, namespace and stream mutation recipes
        run: |
          mkdir -p tmp/logs
          python3 scripts/fs-windows-test-harness/run-host-steps \
            --scenario cli-populate-win-verify-chkdsk \
            --scenario cli-write-at-win-verify-chkdsk \
            --scenario cli-truncate-win-verify-chkdsk \
            --scenario cli-mkdir-parents-win-verify-chkdsk \
            --scenario cli-rename-win-verify-chkdsk \
            --scenario cli-link-win-verify-chkdsk \
            --scenario cli-empty-directory-win-verify-chkdsk \
            --scenario cli-attrlist-data-win-verify-chkdsk \
            --scenario cli-attrlist-split-extents-win-verify-chkdsk \
            --capture-dir tmp/slate-writer --floor 9 \
            >tmp/logs/slate-writer-capture.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slate-writer-cases-${{ github.sha }}
          path: |
            tmp/slate-writer/
            tmp/logs/slate-writer-capture.log
          if-no-files-found: error
          retention-days: 7
  windows-cases:
    name: Windows formats and chkdsk grades the cases
    needs: writer-cases
    runs-on: windows-latest
    # Thirteen 256 MiB images, two Windows formats and thirteen read-only chkdsk
    # passes. A bound, so a hung mount fails by name (#388).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Windows namespace and stream manifest contracts (floor 11)
        shell: pwsh
        run: ./tests/scripts/slate-windows-manifest.ps1
      - uses: actions/download-artifact@v4
        with:
          name: slate-writer-cases-${{ github.sha }}
          path: tmp/writer-input
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install rust-img-vhd
        shell: pwsh
        run: |
          $vhd = (Select-String -Path chores.yml -Pattern '^\s*IMG_VHD_REF:\s*(\S+)').Matches[0].Groups[1].Value
          if (-not $vhd) { throw 'IMG_VHD_REF is missing from chores.yml' }
          git clone --depth 1 --branch $vhd https://github.com/antimatter-studios/rust-img-vhd.git $env:RUNNER_TEMP/rust-img-vhd
          cargo install --locked --path $env:RUNNER_TEMP/rust-img-vhd --features cli --bin rust-img-vhd
      # The contracts' scratch volume goes through rust-img-vhd, so after it.
      - name: Windows cluster allocation contracts (floor 14)
        shell: pwsh
        run: ./tests/scripts/slate-windows-allocation.ps1
      - name: Build the release CLI
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --locked --release --features cli --bin rust-fs-ntfs
      - name: Format the cases and grade each with Windows chkdsk
        shell: pwsh
        run: >-
          ./test-disks/build-slate-oracle-cases.ps1
          -Cli target/release/rust-fs-ntfs.exe
          -OutDir tmp/slate-oracle
          -WriterCases tmp/writer-input/slate-writer/captures.tsv
          -WriterImages tmp/writer-input/slate-writer/images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slate-oracle-cases-${{ github.sha }}
          path: |
            tmp/slate-oracle/cases.tsv
            tmp/slate-oracle/writer-captures.tsv
            tmp/slate-oracle/images/*.img
            tmp/slate-oracle/*.mkfs.json
            tmp/slate-oracle/chkdsk/
            tmp/slate-oracle/windows-read/
            tmp/slate-oracle/windows-alloc/
            tmp/slate-oracle/windows-read-diag/
          if-no-files-found: error
          retention-days: 7
  slate-check:
    name: Slate checks the same bytes
    needs: windows-cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: slate-oracle-cases-${{ github.sha }}
          path: tmp/slate-oracle
      - name: Fetch Slate at the pinned commit and check its licences
        run: bash scripts/slate-oracle.sh fetch "$RUNNER_TEMP/slate-ntfs"
      - name: Build Slate's MIT checker
        run: |
          set -euo pipefail
          checker="$(bash scripts/slate-oracle.sh build "$RUNNER_TEMP/slate-ntfs")"
          echo "SLATE_CHECKER=$checker" >>"$GITHUB_ENV"
          mkdir -p tmp/slate-oracle/out
          {
            printf 'slate_commit\t%s\n' "$(git -C "$RUNNER_TEMP/slate-ntfs" rev-parse HEAD)"
            printf 'rustc\t%s\n' "$(rustc --version)"
            printf 'source_head\t%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
          } >tmp/slate-oracle/out/provenance.tsv
      # Four format controls plus populate, write-at and truncate (#827),
      # mkdir, rename, unlink and rmdir (#828), and the named-stream and EA
      # recipes (#829) from the existing Windows matrix: thirteen cases,
      # never fewer silently.
      - name: Compare Slate's verdicts with Windows chkdsk's
        run: >-
          bash scripts/slate-oracle.sh compare
          tmp/slate-oracle/cases.tsv tmp/slate-oracle/images
          "$SLATE_CHECKER" tmp/slate-oracle/out 13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slate-oracle-verdicts-${{ github.sha }}
          path: tmp/slate-oracle/out/
          if-no-files-found: error
          retention-days: 14
      # Slate's copy-only writer (#863): each row of tests/slate-writes.tsv
      # patches bytes the write-at recipe left in one root file, on a copy
      # of the captured image, and the source must keep its SHA-256. Runs
      # whether or not the comparison agreed: they grade different things.
      - name: Build Slate's MIT copy-only writer
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          writer="$(bash scripts/slate-oracle.sh build "$RUNNER_TEMP/slate-ntfs" ntfs-write-lab)"
          echo "SLATE_WRITER=$writer" >>"$GITHUB_ENV"
      - name: Slate writes copies of the write-at image, never the source
        if: ${{ !cancelled() && env.SLATE_WRITER != '' }}
        run: >-
          bash scripts/slate-oracle.sh write
          tests/slate-writes.tsv tmp/slate-oracle/images
          "$SLATE_WRITER" tmp/slate-oracle/writes 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slate-oracle-writes-${{ github.sha }}
          path: |
            tmp/slate-oracle/images/cli-write-at-win-verify-chkdsk.img
            tmp/slate-oracle/writes/
          if-no-files-found: error
          retention-days: 14
