name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:
  # Manual trigger — exposed as "Run workflow" in the GitHub Actions UI.
  # Lets us run validate-mkfs-windows on demand without cutting a tag.
  # Tweak the Rust crate, push, click "Run workflow", get real chkdsk
  # output back in ~5 minutes. The test job runs on every push too.
  workflow_dispatch:

# Read-only unless a job asks for more. A workflow that declares nothing
# inherits the repository's default token, which a settings change can make
# read-write without this file changing, so the grant is stated here, where
# a review sees it.
permissions:
  contents: read

jobs:
  interrupted-bootstrap:
    name: interrupted fixture bootstrap guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-interrupted-bootstrap.py
      - run: python3 tests/interrupted_bootstrap_guard.py
      - name: Fetch the original fixture blobs for byte preservation checks
        run: |
          original=$(python3 -c 'import json; print(json.load(open("test-disks/windows-interrupted-bootstrap.json"))["original_commit"])')
          git fetch --no-tags --depth=1 origin "$original"
      - run: python3 tests/interrupted_bootstrap_preservation.py
      - name: Capture scrub preserves fixed-VHD framing and refuses invalid BPBs
        shell: pwsh
        run: ./tests/scripts/scrub-bootstrap.ps1

  python-abi:
    name: Python ctypes client over the shared C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The aggregate gate requires every Python oracle job
        run: python3 -m unittest -v tests/python/test_ci_gate.py
      - name: The fsutil record binding refuses a wrong image or revision
        if: ${{ !cancelled() }}
        run: python3 -m unittest -v tests/python/test_record_binding.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Build the shared library without changing the declared crate types
        run: cargo rustc --release --lib --crate-type cdylib
      - name: Compile the independent C layout and call probe
        run: cc -std=c11 -Wall -Werror -Iinclude tests/python/abi_volume_info.c -Ltarget/release -lfs_ntfs -Wl,-rpath,"$PWD/target/release" -o target/abi_volume_info
      - name: Decompress the Windows-recovered fixture
        run: gunzip -c test-disks/windows-interrupted-1.recovered.img.gz > target/python-abi.img
      - name: Python client agrees with the C ABI
        env:
          FS_NTFS_SHARED_LIB: ${{ github.workspace }}/target/release/libfs_ntfs.so
          FS_NTFS_ABI_PROBE: ${{ github.workspace }}/target/abi_volume_info
          FS_NTFS_FIXTURE: ${{ github.workspace }}/target/python-abi.img
        run: python3 -m unittest -v tests/python/test_volume_info.py
      - name: Compile the independent C directory-listing probe
        run: cc -std=c11 -Wall -Werror -Iinclude tests/python/abi_dir_listing.c -Ltarget/release -lfs_ntfs -Wl,-rpath,"$PWD/target/release" -o target/abi_dir_listing
      - name: Install the independent raw-directory reference
        run: sudo apt-get update && sudo apt-get install -y ntfs-3g
      - name: Python directory iterator agrees with the C ABI
        env:
          FS_NTFS_SHARED_LIB: ${{ github.workspace }}/target/release/libfs_ntfs.so
          FS_NTFS_DIR_PROBE: ${{ github.workspace }}/target/abi_dir_listing
          FS_NTFS_FIXTURE: ${{ github.workspace }}/target/python-abi.img
        run: python3 -m unittest -v tests/python/test_dir_listing.py

  # The same Python client graded against Windows' own fsutil record of the
  # volume it formatted, bound to that image's SHA-256.
  python-volume-info-windows:
    name: Python volume info matches Windows fsutil
    needs: [windows-native-read-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Build the shared library without changing the declared crate types
        run: cargo rustc --release --lib --crate-type cdylib
      - name: Download Windows-authored native read fixtures
        uses: actions/download-artifact@v4
        with:
          name: ntfs-windows-native-read-fixtures
          path: test-disks
      - name: Python client agrees with fsutil fsinfo ntfsinfo
        env:
          FS_NTFS_SHARED_LIB: ${{ github.workspace }}/target/release/libfs_ntfs.so
          FS_NTFS_WINDOWS_IMAGE: ${{ github.workspace }}/test-disks/ntfs-cli-read.img
          FS_NTFS_WINDOWS_RECORD: ${{ github.workspace }}/test-disks/ntfs-cli-read.ntfsinfo.txt
          FS_NTFS_WRONG_IMAGE: ${{ github.workspace }}/test-disks/ntfs-attrlist.img
          FS_NTFS_EXPECTED_HEAD: ${{ github.sha }}
        run: python3 -m unittest -v tests/python/test_volume_info_windows.py
      - name: Compile the C directory caller for the same Windows image
        run: cc -std=c11 -Wall -Werror -Iinclude tests/python/abi_dir_listing.c -Ltarget/release -lfs_ntfs -Wl,-rpath,"$PWD/target/release" -o target/abi_dir_listing
      - name: Python and C directory iterators agree with native Windows, zero skipped
        env:
          FS_NTFS_SHARED_LIB: ${{ github.workspace }}/target/release/libfs_ntfs.so
          FS_NTFS_DIR_PROBE: ${{ github.workspace }}/target/abi_dir_listing
          FS_NTFS_WINDOWS_IMAGE: ${{ github.workspace }}/test-disks/ntfs-cli-read.img
          FS_NTFS_DIRECTORY_RECORD: ${{ github.workspace }}/test-disks/ntfs-cli-read.directory.json
          FS_NTFS_WRONG_IMAGE: ${{ github.workspace }}/test-disks/ntfs-attrlist.img
          FS_NTFS_EXPECTED_HEAD: ${{ github.sha }}
        run: python3 tests/python/test_dir_listing_windows.py

  readonly-file-name:
    name: focused readonly FILE_NAME regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    # No fixture-job dependency: this unchanged test formats its own image.
    # The focused red is evidence for #629, while the full suite and native
    # Windows validation remain required independently.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record and verify the exact source head
        run: |
          mkdir -p tmp/logs
          git rev-parse HEAD | tee tmp/logs/readonly-head.txt
          test "$(cat tmp/logs/readonly-head.txt)" = "$EXPECTED_HEAD"
          sha256sum tests/field_exhaustion_fn.rs > tmp/logs/readonly-test.sha256
      - name: Check out the pinned existing tier runner
        run: |
          core_ref="$(sed -n 's/^  FS_CORE_REF: *//p' chores.yml | tr -d '\r')"
          test -n "$core_ref"
          git clone --quiet --depth 1 --branch "$core_ref" \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run the unchanged readonly test through the existing suite tier
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips --refuse-ignored suite -- \
            nice -n 10 cargo test --release --locked --features cli,harness \
            --test field_exhaustion_fn readonly_attribute_reflected_in_file_name -- --exact --nocapture
          grep -Fxq 'test readonly_attribute_reflected_in_file_name ... ok' tmp/logs/suite.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' tmp/logs/suite.log
          sha256sum --check tmp/logs/readonly-test.sha256
      - name: Retain focused verdict and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-file-name-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tmp/logs/suite.log
            tmp/logs/readonly-head.txt
            tmp/logs/readonly-test.sha256
          if-no-files-found: error

  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A change to documentation alone runs only the ubuntu leg, which carries
    # fmt, clippy, the family checks and the shared-block check: lint is what
    # checks a documentation change. The ARM64 and macOS legs are dropped.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is native ARM64, not a cross-check: `c_char` is
        # `u8` on aarch64 Linux and `i8` on x86_64 and macOS, so a lint
        # about a C-ABI pointer cast can fail on one and not the other (#268).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        exclude: ${{ fromJSON(needs.changes.outputs.code == 'false' && '[{"os":"ubuntu-24.04-arm"},{"os":"macos-latest"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: check out sibling repos
        # Replaces `submodules: recursive`. The pins live in chores.yml,
        # so CI and a developer's machine read the same declaration
        # instead of restating it in YAML.
        #
        # chore is fetched from its release tarball at a PINNED version.
        # An unpinned installer would make this workflow's behaviour
        # depend on whatever chore shipped that morning, which is the
        # opposite of what pinning the siblings is for.
        #
        # WINDOWS RUNNERS FALL BACK TO PLAIN CLONES. chore publishes
        # darwin and linux builds only, and `uname -s` under Git Bash
        # reports MINGW64_NT-*, so there is nothing to install. The
        # fallback re-states the pins, which is exactly the duplication
        # `chore siblings` exists to remove -- so it reads them OUT OF
        # chores.yml rather than hardcoding them, and the single
        # declaration still holds.
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }

          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.11.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.11.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.11.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.11.0-darwin-x86_64.tar.gz" ;;
            *)              asset="" ;;   # Windows: no chore build
          esac

          if [ -n "$asset" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/$asset" \
              | sudo tar xz -C /usr/local/bin chore
            chore siblings
          else
            core_ref="$(pin FS_CORE_REF)"
            harness_ref="$(pin HARNESS_REF)"
            echo "chore has no build for $(uname -s); cloning siblings directly"
            echo "  rust-fs-core              $core_ref"
            echo "  fs-windows-test-harness $harness_ref"
            git clone --quiet --depth 1 --branch "$core_ref" \
              https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
            git clone --quiet --depth 1 --branch "$harness_ref" \
              https://github.com/antimatter-studios/fs-windows-test-harness.git ../fs-windows-test-harness
          fi
      - name: Install Rust
        # Keep in sync with rust-toolchain.toml. Explicit version here
        # guards against rust-toolchain.toml being deleted and silently
        # tracking a newer stable (which can introduce breaking clippy
        # lints on unchanged code).
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.arch: both Linux legs report runner.os == Linux, and a
          # shared key would restore one architecture's target/ on the other.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --check

      - name: Retain independent physical positions in the immutable Windows log
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: 2
        run: nice -n 10 cargo test --locked --manifest-path scripts/logfile-record-oracle/Cargo.toml --test physical_position -- --nocapture
      - name: Diagnose immutable raw locations and reject pointer and torn-page controls
        if: always() && matrix.os == 'ubuntu-latest'
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: 2
        run: nice -n 10 cargo test --locked --manifest-path scripts/logfile-record-oracle/Cargo.toml --test raw_location -- --nocapture
      - name: Upload raw Windows record-position evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: logfile-physical-position
          path: tmp/logfile-physical-position/
          if-no-files-found: error

      # cargo-deny — fail the build if any dep license drifts outside
      # the MIT / Apache / BSD / ISC / Unicode / Zlib / CC0 / 0BSD
      # allowlist in deny.toml, or if a yanked / advisory-flagged
      # version creeps in. Pairs with the project's "no GPL/LGPL/AGPL"
      # policy. Run once on ubuntu — license check doesn't vary by OS.
      #
      # Install on the runner (via taiki-e/install-action's prebuilt
      # binary) instead of EmbarkStudios/cargo-deny-action. The Embark
      # action runs in an Alpine docker image with rust 1.85-musl baked
      # in, which fights rust-toolchain.toml's `1.95.0` pin — cargo
      # inside the container tries to install `1.95.0-musl` and dies.
      # Running on the runner reuses the toolchain installed above.
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny check
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --all-features check
      - name: Independent decoder licence allowlist and formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo deny --manifest-path scripts/logfile-record-oracle/Cargo.toml check licenses
          cargo fmt --manifest-path scripts/logfile-record-oracle/Cargo.toml --check

      # THE ONE REQUIRED CHECK STANDS FOR EVERY JOB (#409). rust-fs-core's
      # family-check (no copy of a family script, every call in place)
      # and ci-gate (ci-ok needs every job, .github-guard requires ci-ok
      # alone), run in place from ../rust-fs-core. The non-gating declaration
      # lives in the chore task, once. Once, on ubuntu: neither varies by OS.
      - name: family scripts and the one required check
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash ../rust-fs-core/scripts/family-check.sh
          chore check:ci-gate

      # clippy gate. Pre-commit hook runs the same invocation locally
      # so this should never fail on a clean push; it's the second line
      # of defence against drift via merges or rebases that bypass the
      # hook. Lint output is NOT deterministic across architectures: the
      # C-ABI `*mut c_char` casts are redundant exactly where `c_char` is
      # `u8`, so ubuntu-latest alone passed while aarch64 failed (#268).
      # Run it on both Linux architectures; macOS adds nothing x86 lacks.
      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: bash ../rust-fs-core/scripts/tier.sh --refuse-skips clippy -- cargo clippy --locked --all-targets --features cli,harness -- -D warnings

      # Unix-only mutations can leave unused mut bindings on Windows (#617).
      # Clippy cross-checks every target without needing a Windows linker.
      - name: cargo clippy (Windows all targets)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-pc-windows-msvc
          mv tmp/logs/clippy.log tmp/logs/clippy-host.log
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips clippy -- cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets --features cli,harness -- -D warnings

      # The shell tests (tests/scripts/*.sh): the scripts that turn the
      # Windows VM's output into verdicts. By glob, like `chore test:scripts`.
      # Through run-script-tests.sh, which fails if ANY test failed; a bare
      # for-loop reported only the last test's status (#362).
      - name: shell tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/run-script-tests.sh tests/scripts

      # The PowerShell the capture workflow runs on Windows, driven with
      # chkdsk's real reports so it is tested on every pull request rather
      # than only when someone dispatches a capture (#137).
      - name: capture script tests
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: pwsh -NoProfile -File tests/scripts/capture-chkdsk.ps1

      # The Windows harness's image sync, run through the real function with
      # the storage cmdlets mocked: dismount, then offline, then copy, and a
      # failed dismount stops the copy. Linux only: the test stands an
      # ordinary file in for \\.\PhysicalDriveN, which is a device on Windows.
      - name: Sync-VhdToImg order test
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: pwsh -NoProfile -File tests/scripts/sync-vhd-order.ps1

      - name: Windows fixture lifecycle test
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        timeout-minutes: 5
        run: pwsh -NoProfile -File tests/scripts/windows-fixture-phases.ps1

      # Test scope is intentionally narrow: only tests that DON'T need
      # the out-of-tree `test-disks/*.img` fixtures. The fixture-driven
      # integration tests (tests/ads.rs, tests/file_data.rs, etc.)
      # require ~3 GB of pre-baked NTFS images that aren't (and won't
      # be) committed to git. Authoritative NTFS validation runs on
      # Windows via chkdsk in `validate-mkfs-windows`; the Linux job's
      # role is just "did the crate compile and do the in-memory tests
      # pass?"
      #
      # `--lib` runs every unit test inside src/ (~hundreds of them).
      # `--test mkfs_roundtrip --test mkfs_bin_smoke` runs the two
      # integration-test files that generate their own data instead
      # of reading fixtures. Anything else is a fixture-test and
      # stays out of CI.
      # --locked everywhere: cargo must NOT silently regenerate a stale
      # Cargo.lock. If the lock drifts from Cargo.toml / the rust-fs-core
      # submodule, these fail loudly here at PR time ("lock file needs to
      # be updated but --locked was passed") instead of surfacing as a
      # dirty-tree abort at `cargo publish`. Keeps the committed lock honest.
      # EXECUTED-TEST FLOORS, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE.
      #
      # `cargo test` exits 0 on "0 passed; 0 failed". A filter that selects
      # nothing, a build that produced no test binaries, and a target list
      # that came out empty therefore report EXACTLY the green a full run
      # reports, and every other gate in this workflow reads that green and
      # agrees. The only thing that can see an absence is a count, so each
      # run below counts what it executed and refuses a number that says it
      # stopped early. #278.
      #
      # ONE FLOOR PER RUN SELECTION, NOT ONE PER JOB. The three `cargo test`
      # invocations in this job select DISJOINT sets: `--lib` is the unit
      # tests, `--test mkfs_roundtrip --test mkfs_bin_smoke` is the two
      # fixture-free integration files, and the debug `--lib` further down is
      # the same unit tests rebuilt with overflow checks on (it exists for
      # the PROFILE, not for the breadth -- see the long comment above it).
      # Any one of them can empty out while the others stay full, so a single
      # shared total would hide precisely the case a floor is for.
      #
      # The counts come from the last CI run on main at the time of writing,
      # run 34985102618, read out of the job logs on 2026-09-17. They are the
      # same on all three legs of the matrix. Floors sit a little under the
      # measurement so ordinary churn does not trip them, and they move UP
      # with the suite and never down.
      #
      # `awk '{s+=$4}'` rather than `bc`: this job runs on macOS too, and the
      # sibling crates run the same shape on windows-latest where the default
      # shell is pwsh. Keep it POSIX and keep it in one pipeline.
      #
      # EACH RUN IS A QUIET TIER. `../rust-fs-core/scripts/tier.sh <tier> -- cargo test ...`
      # (the same line `chore test:<tier>` runs) writes the whole run to
      # tmp/logs/<tier>.log and prints one verdict line; a failure prints the
      # log's tail, and a pass that printed more than the tier's measured
      # budget exits 65. The floor below reads that log. The exit status is
      # the suite's own -- tier.sh never pipes through `tee`, which is how
      # `cmd | tee` reports a red suite as green -- so GitHub's `bash -e`
      # stops the step on a failure before the floor is read. Every log is
      # uploaded as the `test-logs-*` artifact at the end of the job.
      - name: unit tests (release) with an executed-test floor
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips unit -- cargo test --release --locked --lib
          # Measured 637 executed. Floor 600, ~6% of slack.
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/unit.log | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 600)"
          if [ "$n" -lt 600 ]; then
              echo "::error::only $n unit tests executed, floor is 600 -- 637 ran on 2026-09-17 in run 34985102618, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi
      # The floor here is 15 out of a measured 16, which looks like no margin at
      # all and is the right number anyway: this selection is two named test
      # binaries, so it does not drift the way a `--lib` count does, and what
      # the floor has to catch is the drop to ZERO -- a renamed file leaving
      # `--test mkfs_roundtrip` selecting nothing, which `cargo test` reports
      # as a clean pass. A small floor above zero catches that; a floor of
      # zero catches nothing. Raise it when the files grow.
      - name: fixture-free integration tests with an executed-test floor
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips mkfs -- cargo test --release --locked --features cli,harness --test mkfs_roundtrip --test mkfs_bin_smoke
          # Measured 16 executed (mkfs_roundtrip 9 + mkfs_bin_smoke 7) on
          # 2026-09-29, when mkfs_bin_smoke gained the --version test. Floor 15.
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/mkfs.log | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 15)"
          if [ "$n" -lt 15 ]; then
              echo "::error::only $n tests executed, floor is 15 -- 16 ran on 2026-09-29, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi

      - name: Independent operation model contract
        run: |
          # Reuse the measured fixture-free budget, keeping a distinct log.
          read -r lines bytes < <(awk '$1 == "mkfs" { print $2, $3 }' scripts/tier-budgets.txt)
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips --refuse-ignored \
            op-sequence-reference-model op-sequence-reference-model "$lines" "$bytes" -- \
            cargo test --release --locked --test op_sequence_reference_model
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/op-sequence-reference-model.log | awk '{s+=$4} END{print s+0}')
          # Eight declared contracts in #680, #731's named streams and #732's
          # EAs; zero selected is never a pass.
          test "$n" -ge 10 || { echo "::error::model contracts: $n executed, floor 10"; exit 1; }

      - name: Arbitrary-input operation generator and replay contracts
        run: |
          read -r lines bytes < <(awk '$1 == "mkfs" { print $2, $3 }' scripts/tier-budgets.txt)
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips --refuse-ignored \
            op-sequence-generator op-sequence-generator "$lines" "$bytes" -- \
            cargo test --release --locked --test op_sequence_generator
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/op-sequence-generator.log | awk '{s+=$4} END{print s+0}')
          # Eight declared fixture-free contracts in #681, #684's pin format,
          # #731's stream opcodes and #732's EA opcodes, on every host leg.
          test "$n" -ge 11 || { echo "::error::generator contracts: $n executed, floor 11"; exit 1; }

      - name: Generated operations and fresh-reopen comparisons
        run: |
          read -r lines bytes < <(awk '$1 == "mkfs" { print $2, $3 }' scripts/tier-budgets.txt)
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips --refuse-ignored \
            op-sequence-readback op-sequence-readback "$lines" "$bytes" -- \
            cargo test --release --locked --test op_sequence_readback
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/op-sequence-readback.log | awk '{s+=$4} END{print s+0}')
          # Four original seeds, four declared #682 image-harness contracts,
          # #683's corpus replay, #684's three shrink and capture contracts,
          # #731's named-stream case and #732's EA case.
          test "$n" -ge 14 || { echo "::error::readback contracts: $n executed, floor 14"; exit 1; }

      - name: Operation sequences against ntfs-3g
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ntfs-3g
          chore test:op-sequence-oracle

      - name: Keep operation sequence reproducers and refusal statistics
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: op-sequence-model
          path: |
            tmp/op-sequence-model/
            tmp/logs/op-sequence-oracle.log
            tmp/logs/op-sequence-reference-model.log
            tmp/logs/op-sequence-generator.log
            tmp/logs/op-sequence-readback.log
          if-no-files-found: error

      # AND ONCE IN DEBUG, BECAUSE `overflow-checks` IS OFF IN RELEASE.
      #
      # Every other `cargo test` in this repository is `--release`, and
      # `[profile.release]` sets `lto`, `codegen-units`, `opt-level` and
      # `panic` but not `overflow-checks`, so it defaults off. A defect
      # whose only symptom is an arithmetic-overflow panic therefore
      # cannot be observed by any of them: the guard and the gate live in
      # different build profiles.
      #
      # This is narrower than "arithmetic is untested". The crate's 37
      # `checked_add`/`checked_sub`/`checked_mul` sites return `None` or
      # an error, and release observes those perfectly well. What it
      # cannot observe is the case where the ONLY symptom is the panic —
      # which is what `signed_bytes_needed` was before it was fixed:
      # negating `i64::MIN` panicked in debug, wrapped in release, and
      # the wrap happened to reach the right answer through the
      # function's fallback. Its four tests ran in CI and could not fail
      # there.
      #
      # Measured on this branch by reintroducing that defect:
      #
      #     cargo test --release --locked --lib   ->  EXIT=0,   615 passed
      #     cargo test --locked --lib             ->  EXIT=101, 611 passed, 4 failed
      #                                               "attempt to negate with overflow"
      #
      # With the defect fixed, both are EXIT=0 and 615 passed — so the
      # difference is the defect, not the profile.
      #
      # `--lib` only: the unit tests need no fixtures, so this costs a
      # second compile and nothing else. It is deliberately not
      # `--release`'s twin in coverage — it exists for the profile, not
      # for the breadth.
      #
      # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
      # This run has no `--release`, so overflow-checks are on, and it is
      # what makes every arithmetic test in this crate mean anything --
      # `signed_bytes_needed` above is the case that proved it.
      #
      # The variable tells `overflow_checks::the_build_the_gate_asked_to
      # _check_does_check` in src/lib.rs that THIS is the run that must
      # trap an overflow -- asking the build directly rather than
      # inferring it from which spellings of "disabled" happen to be
      # absent from Cargo.toml.
      #
      # Declared as an `env:` mapping rather than inline as
      # `VAR=1 cargo test`. This job's matrix is ubuntu + macos, so the
      # inline form would work here; the mapping is what the
      # cross-platform siblings require, because an inline prefix is a
      # PowerShell syntax error on windows-latest. The guard reads both
      # spellings, and the copies of it stay one answer rather than
      # several.
      #
      # Do not add `--release` to this run, and do not drop the variable:
      # tests/ci_profile.rs reads this file and fails if no `cargo test`
      # in it runs without `--release` while setting this. See #248.
      #
      # The floor below counts this run separately from the release `--lib`
      # above even though the two select the same tests: they are separate
      # invocations, and an edit that empties one empties neither the other
      # nor the evidence. See the floor commentary above the release run.
      - name: unit tests (debug, overflow checks armed) with an executed-test floor
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips unit-debug -- cargo test --locked --lib
          # Measured 637 executed. Floor 600, ~6% of slack.
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/unit-debug.log | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 600)"
          if [ "$n" -lt 600 ]; then
              echo "::error::only $n unit tests executed under overflow checks, floor is 600 -- 637 ran on 2026-09-17 in run 34985102618, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      # The whole of every tier, kept: the terminal got a verdict line and a
      # failure's tail, and this is the rest. always(), because a failed run
      # is when somebody wants it.
      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: ignore

  windows-native-read-fixtures:
    name: Windows-authored native read fixtures
    # Skipped, with integration and cli after it, for documentation alone.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # Measured at 2.1 to 2.4 minutes. Without a bound, a step that hangs holds
    # the runner for GitHub's six hours and prints nothing (#388).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      # Full manual, merge-group and tag runs share the dedicated oracle's
      # descriptor/rights/hash contract. ci-ok directly needs this job.
      - name: Check out rust-fs-core at the sibling pin
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^  FS_CORE_REF: *//p' chores.yml | tr -d '\r')"
          git clone --quiet --depth 1 --branch "$core_ref" \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - name: Compare Windows descriptors and verify retained evidence
        shell: bash
        timeout-minutes: 10
        env:
          NTFS_SD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/security-descriptor-windows-oracle.sh
      - name: Keep Windows descriptor evidence on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-descriptor-windows-full-${{ github.sha }}
          path: |
            security-descriptor-windows.tsv
            security-descriptor-zero-flag.tsv
            security-descriptor-zero-flag.bin
            tmp/logs/unit.log
          if-no-files-found: error
      # A syntax error in the USN journal scripts fails here, by name, before
      # any fixture is built (#609).
      - name: Parse the USN journal PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in 'test-disks/capture-usn-journal-data.ps1', 'test-disks/probe-usn-read-cursors.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Output "${f}: $_" }; throw "$f does not parse" }
            Write-Output "${f}: parses"
          }
      - name: Install rust-img-vhd
        shell: pwsh
        run: |
          $vhd = (Select-String -Path chores.yml -Pattern '^\s*IMG_VHD_REF:\s*(\S+)').Matches[0].Groups[1].Value
          git clone --depth 1 --branch $vhd https://github.com/antimatter-studios/rust-img-vhd.git $env:RUNNER_TEMP/rust-img-vhd
          cargo install --locked --path $env:RUNNER_TEMP/rust-img-vhd --features cli --bin rust-img-vhd
      - name: Build Windows-authored fixtures
        shell: pwsh
        run: pwsh -File test-disks/build-windows-native-read-fixtures.ps1
      - name: Ctrl-C interrupts the inventory CLI process
        shell: pwsh
        run: cargo test --locked --features cli,harness --test cli_inventory_ctrl_c
      - name: Measure which names Win32 can create as files
        shell: pwsh
        run: pwsh -File test-disks/measure-win32-names.ps1
      # What Windows does with a change journal in each state a writer that
      # cannot append to it could leave it in (#479).
      - name: Measure what Windows does with a change journal
        shell: pwsh
        run: pwsh -File test-disks/measure-usn-journal.ps1
      # Real USN_RECORD_V2 records, checked against fsutil's file ID (#609).
      - name: Capture and decode Windows USN_RECORD_V2 records
        id: usn_v2_capture
        shell: pwsh
        run: |
          pwsh -File test-disks/capture-usn-v2-records.ps1
          cargo test --locked --test usn_windows_capture
      # The fixtures upload below runs only on success, so a failed grade
      # would otherwise discard the bytes it graded. This keeps the raw
      # capture, fsutil's manifest and the tested head on every outcome, and
      # names the capture stage that left a file absent.
      - name: Record the USN_RECORD_V2 capture diagnostics
        if: always() && steps.usn_v2_capture.outcome != 'skipped'
        shell: pwsh
        env:
          CAPTURE_OUTCOME: ${{ steps.usn_v2_capture.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $lines = @(
            "github.sha: $env:GITHUB_SHA",
            "pull_request.head.sha: $env:PR_HEAD_SHA",
            "git HEAD: $(git rev-parse HEAD)",
            "capture and decode step outcome: $env:CAPTURE_OUTCOME"
          )
          foreach ($f in 'test-disks/usn-v2-capture.bin', 'test-disks/usn-v2-capture.tsv') {
            if (Test-Path -LiteralPath $f) {
              $len = (Get-Item -LiteralPath $f).Length
              $hash = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash
              $lines += "${f}: $len bytes, sha256 $hash"
            } else {
              $lines += "${f}: ABSENT - capture-usn-v2-records.ps1 failed before writing it"
            }
          }
          $lines | Set-Content -LiteralPath test-disks/usn-v2-capture.diagnostics.txt
          $lines | ForEach-Object { Write-Output $_ }
      - name: Upload the USN_RECORD_V2 capture diagnostics
        if: always() && steps.usn_v2_capture.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-usn-v2-capture-diagnostics
          path: |
            test-disks/usn-v2-capture.diagnostics.txt
            test-disks/usn-v2-capture.bin
            test-disks/usn-v2-capture.tsv
          if-no-files-found: error
          retention-days: 7
      - name: Capture Windows-authored $I30 create/delete/reuse evidence
        shell: pwsh
        run: pwsh -File test-disks/capture-i30-slack.ps1
      - name: Compare $I30 slack candidates with the Windows manifest
        shell: pwsh
        env:
          NTFS_I30_SLACK_IMAGE: test-disks/ntfs-i30-slack.img
          NTFS_I30_SLACK_MANIFEST: test-disks/ntfs-i30-slack.manifest.json
        run: |
          $m = Get-Content -Raw $env:NTFS_I30_SLACK_MANIFEST | ConvertFrom-Json
          $h = (Get-FileHash $env:NTFS_I30_SLACK_IMAGE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne $m.image_sha256) { throw "image $h is not the captured $($m.image_sha256)" }
          cargo test --release --locked --lib --features windows-i30-oracle index_slack::windows_capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The capture writes its manifest and raw-scan diagnostic before it
      # judges PRECONDITION i30-raw-deleted-candidate, so a failed capture or
      # comparison still uploads them here. Both are small text bound to the
      # image by image_sha256; the 256 MB image itself is never retained on a
      # failure. A missing file warns rather than fails: the step that failed
      # already makes the job red, and this upload must not replace its error.
      - name: Upload $I30 capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-i30-slack-diagnostics
          path: |
            test-disks/ntfs-i30-slack.manifest.json
            test-disks/ntfs-i30-slack.diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
      # A disposable volume's real USN_JOURNAL_DATA admits cursors (#609). The
      # capture script also runs the read probe on that volume before removing it.
      - name: Capture Windows USN journal data and admit cursors against it
        id: usn_journal_capture
        shell: pwsh
        run: |
          pwsh -File test-disks/capture-usn-journal-data.ps1
          cargo test --locked --test usn_cursor_windows_capture
      # What FSCTL_READ_USN_JOURNAL answers for the current, a future and a
      # wrong-identity cursor on that same journal, read-only (#609). The probe
      # ran inside the capture step, while the disposable volume was attached.
      - name: Probe Windows USN journal reads and grade cursor admission
        shell: pwsh
        run: |
          cargo test --locked --test usn_cursor_read_probe_windows
      # The journal identity controls' verdicts, the actual and control IDs and
      # the control's failure reason, kept on every outcome.
      - name: Upload the USN journal identity controls
        if: always() && steps.usn_journal_capture.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-usn-journal-identity-controls
          path: |
            test-disks/usn-journal-identity-controls.txt
            test-disks/usn-journal-data.tsv
            test-disks/usn-read-probe.tsv
            test-disks/usn-journal-data.wrong-id-control.tsv
            test-disks/usn-read-probe.wrong-id-control.tsv
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Windows-authored fixtures
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-windows-native-read-fixtures
          path: |
            test-disks/usn-v2-capture.bin
            test-disks/usn-v2-capture.tsv
            test-disks/usn-journal-data.tsv
            test-disks/usn-read-probe.tsv
            test-disks/ntfs-attrlist.img
            test-disks/ntfs-compressed.img
            test-disks/ntfs-symlink.img
            test-disks/ntfs-symlink.targets.tsv
            test-disks/ntfs-cli-read.img
            test-disks/ntfs-cli-read.ntfsinfo.txt
            test-disks/ntfs-cli-read.directory.json
            test-disks/ntfs-cli-read.sha256.tsv
            test-disks/win32-name-verdicts.tsv
            test-disks/ntfs-ea.img
            test-disks/ntfs-ea.names.tsv
            test-disks/ntfs-format-64k.img
            test-disks/ntfs-usnjrnl.img
            test-disks/ntfs-usnjrnl.query.txt
            test-disks/ntfs-usnjrnl.records.csv
            test-disks/ntfs-inventory.img
            test-disks/ntfs-inventory.fileids.txt
            test-disks/ntfs-stat.img
            test-disks/ntfs-stat.windows.tsv
            test-disks/ntfs-ls-recursive.img
            test-disks/ntfs-ls-recursive.windows.tsv
            test-disks/ntfs-i30-slack.img
            test-disks/ntfs-i30-slack.manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload the change journal measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-usn-journal-measurements
          path: |
            test-disks/usn-journal-measurements.txt
            test-disks/usn-measure-*.img
          if-no-files-found: warn
          retention-days: 7

  # Full integration suite — every unit AND integration test, with the
  # read-path .img fixtures generated on the runner via ntfs-3g/mkntfs.
  # This is the SAME gate as release.yml's `crates-test`, run here on
  # every push/PR so fixture-driven regressions (e.g. a capi error
  # contract drifting) are caught before a release tag, not at publish
  # time. Ubuntu-only: mkntfs/ntfs-3g author the fixtures and don't
  # exist on macOS. Authoritative format validation is still chkdsk
  # (validate-mkfs-windows); this proves the crate's own read paths
  # against real ntfs-3g-authored images.
  integration:
    name: full test suite (fixtures + integration)
    runs-on: ubuntu-latest
    needs: [windows-native-read-fixtures]
    steps:
      - uses: actions/checkout@v4
      - name: check out sibling repos
        # Replaces `submodules: recursive`. The pins live in chores.yml,
        # so CI and a developer's machine read the same declaration
        # instead of restating it in YAML.
        #
        # chore is fetched from its release tarball at a PINNED version.
        # An unpinned installer would make this workflow's behaviour
        # depend on whatever chore shipped that morning, which is the
        # opposite of what pinning the siblings is for.
        #
        # WINDOWS RUNNERS FALL BACK TO PLAIN CLONES. chore publishes
        # darwin and linux builds only, and `uname -s` under Git Bash
        # reports MINGW64_NT-*, so there is nothing to install. The
        # fallback re-states the pins, which is exactly the duplication
        # `chore siblings` exists to remove -- so it reads them OUT OF
        # chores.yml rather than hardcoding them, and the single
        # declaration still holds.
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }

          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.11.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.11.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.11.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.11.0-darwin-x86_64.tar.gz" ;;
            *)              asset="" ;;   # Windows: no chore build
          esac

          if [ -n "$asset" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/$asset" \
              | sudo tar xz -C /usr/local/bin chore
            chore siblings
          else
            core_ref="$(pin FS_CORE_REF)"
            harness_ref="$(pin HARNESS_REF)"
            echo "chore has no build for $(uname -s); cloning siblings directly"
            echo "  rust-fs-core              $core_ref"
            echo "  fs-windows-test-harness $harness_ref"
            git clone --quiet --depth 1 --branch "$core_ref" \
              https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
            git clone --quiet --depth 1 --branch "$harness_ref" \
              https://github.com/antimatter-studios/fs-windows-test-harness.git ../fs-windows-test-harness
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
      # Fixture toolchain: ntfs-3g ships both mkntfs (format) and ntfs-3g
      # (loop-mount), the only tools the fixture builder needs. ntfs-3g is
      # used ONLY to author the fixtures — the test binary reads the images
      # raw through the crate's own reader.
      - name: Install fixture toolchain (mkntfs + ntfs-3g)
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g attr
      # Generate the read-path .img fixtures. With these present the
      # fixture-driven integration tests (tests/ads.rs, tests/unicode.rs,
      # …) run instead of self-skipping. The Windows-authored fixtures arrive
      # from the required producer job.
      - name: Generate NTFS read-path fixtures
        run: bash test-disks/build-ntfs-feature-images.sh
      - name: Download Windows-authored native read fixtures
        uses: actions/download-artifact@v4
        with:
          name: ntfs-windows-native-read-fixtures
          path: test-disks
      # The Windows checkpoint captures these two steps read are pinned
      # (test-disks/logfile-checkpoint-captures.json): snapshots of a volume
      # Windows is writing hold whatever the timing gave them, so a live
      # capture cannot gate a merge. logfile-checkpoint-drift.yml takes fresh
      # ones on a schedule and runs the same comparisons over them.
      - name: Compare checkpoint headers and current-record length with the independent decoder
        timeout-minutes: 10
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          nice -n 10 cargo test --locked --manifest-path scripts/logfile-record-oracle/Cargo.toml --test checkpoint_identity
          bash scripts/compare-logfile-record-type.sh
      - name: Compare independently varied native records and explicit checkpoint length
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          CARGO_BUILD_JOBS: 2
        run: bash scripts/compare-logfile-native-metadata.sh
      - name: Retain independent checkpoint header evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logfile-record-type-oracle
          path: |
            tmp/logfile-record-oracle/*.tsv
            tmp/logfile-record-oracle/*.bin
            tmp/logfile-record-oracle/*.stderr
            tmp/logfile-record-oracle/*.json
            tmp/logfile-record-oracle/identity-controls/
          if-no-files-found: error
      # FULL suite — every unit AND integration test, then clippy: a true
      # mirror of release.yml's crates-test, so the release gate never sees
      # a failure CI didn't — including a clippy lint that only a fixture-
      # backed integration test file would trip. (The matrix `test` job also
      # clippies on ubuntu; running it here keeps this gate self-contained
      # and identical to crates-test even if that job is restructured.)
      # --no-fail-fast reports every failing test in one run instead of
      # aborting at the first failing binary (which masks the rest).
      # AN EXECUTED-TEST FLOOR, AND THIS IS THE JOB THAT MOST NEEDS ONE.
      #
      # Everything this job is for depends on a step that ran earlier:
      # `build-ntfs-feature-images.sh` writes the read-path .img fixtures.
      #
      # WHAT A MISSING FIXTURE ACTUALLY DOES, measured on 2026-09-18 at
      # 6670e25 with no fixtures present: the suite FAILS. `cargo test
      # --release --locked --no-fail-fast` exits 101 with 414 FAILED lines,
      # because `tests/common/mod.rs`'s `open` panics ("did you run
      # test-disks/build-ntfs-feature-images.sh?") and files like
      # `tests/attr_resize.rs` panic in `std::fs::copy`. The Windows-authored
      # fixtures also fail when missing. A half-failed builder turns this job red through the
      # suite's own exit status, before the floor is ever read.
      #
      # THE FLOOR IS FOR THE OTHER CASE: a selection that stops matching. A
      # renamed file, a changed filter, a test binary that was not built --
      # `cargo test` exits 0 on "0 passed; 0 failed", and nothing else in
      # this workflow can tell that from a full run. #278, #289.
      #
      # Measured 2026-09-17 from run 34985102618 (job 104435064811, the last
      # CI run on main at the time of writing): 1427 executed. Floor 1350,
      # ~5% of slack. It moves up with the suite and never down.
      # THE KNOWN-DEFECT TESTS, REPORTED NOT GATED. Two tests sat
      # `#[ignore]`d over a link-count defect that had already been fixed
      # (#149) and nothing said so, because nothing ran `--ignored`
      # (#277). A pass here is the signal: the defect is fixed and the
      # test should lose the attribute. Advisory, because the ones left
      # are known-bad by construction and a permanent red gates nothing
      # and means nothing.
      - name: known defects (the ignored tests)
        continue-on-error: true
        run: chore test:ignored

      - name: full suite with an executed-test floor
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips suite -- cargo test --release --locked --features cli,harness --no-fail-fast
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/suite.log | awk '{s+=$4} END{print s+0}')
          # Previous floor 1370 plus the #644 recursive-walk fault contract,
          # three declared #731 named-stream contracts and three #732 EA
          # contracts.
          echo "tests executed: $n (floor 1377)"
          if [ "$n" -lt 1377 ]; then
              echo "::error::only $n tests executed, floor is 1377 -- baseline: 1427 ran on 2026-09-17 in run 34985102618, plus eight model contracts in #680, eight generator contracts in #681, four image-harness contracts in #682, one recursive-walk fault contract in #644, three named-stream contracts in #731 and three EA contracts in #732. The suite passed, so this is not a failing test and not a missing fixture (a missing fixture makes the suite FAIL, loudly). Something stopped tests from being selected: a renamed or unbuilt test binary, or a changed filter. Read tmp/logs/suite.log, uploaded as test-logs-integration."
              exit 1
          fi
      - run: bash ../rust-fs-core/scripts/tier.sh --refuse-skips clippy -- cargo clippy --locked --all-targets --features cli,harness -- -D warnings
      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-integration
          path: tmp/logs/
          if-no-files-found: ignore

  # NTFS validation runs ONLY on the Windows side via Microsoft's
  # chkdsk. That is the only authoritative validator for NTFS, full
  # stop. Our own crate's read-path round-trip runs on every PR via
  # `cargo test` — that's the cheap coverage. The real verdict is
  # chkdsk's, and chkdsk only runs on Windows.
  #
  # Trigger validate-mkfs-windows manually via "Run workflow" while
  # iterating on the mkfs implementation. Setting up the Windows side is
  # documented where the harness lives: docs/vm-setup.md in
  # fs-windows-test-harness, which README.md's matrix section links.

  # AddressSanitizer smoke test (§5.5). Catches OOB reads/writes in
  # the raw-byte buffer manipulations (mft_io / data_runs / attr_io /
  # ea_io) that the regular test suite would otherwise let through
  # silently. Nightly toolchain (ASan needs -Zsanitizer=address);
  # advisory because branch protection does not require this job. Only the
  # nightly-install step tolerates failure; sanitizer findings turn the job
  # red and remain visible to reviewers.
  #
  # THE NAME SAYS WHAT THE JOB IS, WHICH IT DID NOT USED TO (#278).
  #
  # This was `name: unit tests`, and a job's `name:` IS its check-run
  # name, so `unit tests` was what branch protection required and what a
  # reviewer read. It is not the unit tests -- those are the `test`
  # matrix above, reporting as test-ubuntu-latest, test-ubuntu-24.04-arm
  # and test-macos-latest. A green `unit tests` tick here would have
  # stayed green with the cargo invocation below deleted.
  #
  # `(advisory)` is in the name on purpose, and it is the part to keep.
  # This job must not GATE anything: the required set lives in
  # .github-guard and deliberately does not name it, and the next person
  # to edit that file reads this name first.
  #
  # ADVISORY IS NOT THE SAME AS SILENT, which is what `continue-on-error:
  # true` on the job made it (#158). That key cannot tell "nightly stopped
  # building this crate" -- which must not stop work on stable -- from
  # "ASan found an out-of-bounds write", which is the entire reason the
  # job exists. Both produced the same green tick.
  #
  # So the toleration is on the TOOLCHAIN STEP only. A nightly that will
  # not install leaves the job green and says so; a sanitizer finding
  # turns it red. Red here blocks nothing, because the job is not a
  # required check -- it is a signal a human reads, and a signal that
  # cannot go red is not one.
  asan:
    name: unit tests under ASan (nightly toolchain, advisory)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # ADVISORY, DECLARED (#409). ci-ok does not need this job, by decision: a
    # pinned nightly can break independently of stable. Job-level
    # continue-on-error is how that decision is written down where a check
    # can read it -- rust-fs-core's ci-gate refuses a job that is neither in
    # ci-ok's needs nor declared, and accepts a declaration only on a job
    # carrying `if:` or `continue-on-error:`. It does not hide a finding: the
    # job still concludes `failure` on its own check-run (measured: run
    # 35221492916, which had this key, reported the asan job as failure).
    # Only the toolchain install step tolerates failure inside the job.
    continue-on-error: true
    env:
      # PINNED, like every other toolchain in both workflows. It floated on
      # `@nightly` while the rest pin 1.95.0, and combined with the old
      # blanket continue-on-error a nightly that stopped building this
      # crate simply stopped testing it, indefinitely, with no signal.
      # Move this deliberately; the job says when it cannot install.
      ASAN_TOOLCHAIN: nightly-2026-09-01
    steps:
      - uses: actions/checkout@v4
      - name: check out sibling repos
        # Replaces `submodules: recursive`. The pins live in chores.yml,
        # so CI and a developer's machine read the same declaration
        # instead of restating it in YAML.
        #
        # chore is fetched from its release tarball at a PINNED version.
        # An unpinned installer would make this workflow's behaviour
        # depend on whatever chore shipped that morning, which is the
        # opposite of what pinning the siblings is for.
        #
        # WINDOWS RUNNERS FALL BACK TO PLAIN CLONES. chore publishes
        # darwin and linux builds only, and `uname -s` under Git Bash
        # reports MINGW64_NT-*, so there is nothing to install. The
        # fallback re-states the pins, which is exactly the duplication
        # `chore siblings` exists to remove -- so it reads them OUT OF
        # chores.yml rather than hardcoding them, and the single
        # declaration still holds.
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }

          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.11.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.11.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.11.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.11.0-darwin-x86_64.tar.gz" ;;
            *)              asset="" ;;   # Windows: no chore build
          esac

          if [ -n "$asset" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/$asset" \
              | sudo tar xz -C /usr/local/bin chore
            chore siblings
          else
            core_ref="$(pin FS_CORE_REF)"
            harness_ref="$(pin HARNESS_REF)"
            echo "chore has no build for $(uname -s); cloning siblings directly"
            echo "  rust-fs-core              $core_ref"
            echo "  fs-windows-test-harness $harness_ref"
            git clone --quiet --depth 1 --branch "$core_ref" \
              https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
            git clone --quiet --depth 1 --branch "$harness_ref" \
              https://github.com/antimatter-studios/fs-windows-test-harness.git ../fs-windows-test-harness
          fi
      - id: nightly
        continue-on-error: true
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.ASAN_TOOLCHAIN }}
          components: rust-src
      - name: Say so if the pinned nightly is unavailable
        if: steps.nightly.outcome != 'success'
        run: |
          echo "::notice::${ASAN_TOOLCHAIN} could not be installed, so nothing was sanitized in this run. This job is advisory and stays green; bump ASAN_TOOLCHAIN in ci.yml."
      - name: Cache cargo registry
        if: steps.nightly.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: asan-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests under ASan
        # No continue-on-error: a finding here is the job's whole output.
        if: steps.nightly.outcome == 'success'
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips asan -- cargo "+$ASAN_TOOLCHAIN" test --release --locked --lib \
            --target x86_64-unknown-linux-gnu
          # A floor on an ADVISORY job, which is not a contradiction. This job
          # cannot gate a merge (it is not in .github-guard's required set),
          # so the only thing it produces is a signal a human reads -- and a
          # signal that reads green because it sanitized nothing is worse
          # than no signal.
          # ASan needs a nightly toolchain, `-Zsanitizer=address` and an
          # explicit `--target`; every one of those can stop selecting tests
          # without stopping the job.
          #
          # Measured 2026-09-17 from run 34985102618 (job 104435065061): 637
          # executed, the same `--lib` set the stable legs run. Floor 600.
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' tmp/logs/asan.log | awk '{s+=$4} END{print s+0}')
          echo "tests executed under ASan: $n (floor 600)"
          if [ "$n" -lt 600 ]; then
              echo "::error::only $n tests executed under ASan, floor is 600 -- 637 ran on 2026-09-17 in run 34985102618, and a run that executes less than that sanitized nothing rather than passed"
              exit 1
          fi
      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-asan
          path: tmp/logs/
          if-no-files-found: ignore

  # Windows-side validation: chkdsk is the canonical "is this a valid
  # NTFS volume?" check, against the same code Microsoft ships.
  # Triggers:
  #   - tag pushes (release candidates)
  #   - manual `workflow_dispatch` from the GitHub Actions UI
  #   - a pull request that changes the code deciding the bytes on disk
  #     (see the `changes` job below)
  #
  # IT IS A REQUIRED CHECK, AND A SKIPPED REQUIRED CHECK COUNTS AS
  # SATISFIED. Until #266 it ran on tags and dispatch only, so on every
  # pull request it reported `skipped` and the requirement was met by a
  # job that had not run -- the format gate advertised in front of every
  # merge had never seen one. windows-latest provisioning is ~3x slower
  # than ubuntu, which is why it still does not run on every PR; it runs
  # on the ones where it could catch something. A PR that touches none of
  # those paths still satisfies the requirement by skipping, which is the
  # residue of this design and is deliberate.
  #
  # Windows Mount-DiskImage doesn't accept raw .img files, so we wrap
  # the binary's output in a VHD container via rust-img-vhd (from
  # antimatter-studios/rust-img-vhd, an MIT-licensed in-house writer).
  #
  # Diagnostics are aggressive: we capture chkdsk's full output,
  # Get-Volume metadata, and fsutil dumps as artifacts on every run
  # (success or failure) so we can compare what Windows sees across
  # commits. This is the iteration loop for finding mkfs bugs —
  # chkdsk's error text tells us exactly which on-disk structure is
  # wrong.
  # Which paths a pull request touched. A tiny ubuntu job rather than a
  # third-party action: the answer is one `git diff --name-only` against
  # the merge base, and a filter action would be another unpinned
  # dependency in front of the gate it decides.
  #
  # `code` is the run's depth, decided from its event by scripts/ci-plan.sh.
  # Pull requests, every layer of a stack included, and pushes to main run
  # the quick checks (unit, scripts, lint, semver): it is false. The merge
  # queue, tags, manual dispatches and anything unexpected run everything:
  # it is true. The ARM64 and macOS legs, the Windows fixtures and what reads
  # them, the kernel oracle and ASan run only when it is true, and ci-ok
  # accepts those jobs' skip when, and only when, it is false.
  changes:
    name: what this pull request touches
    runs-on: ubuntu-latest
    outputs:
      mkfs: ${{ steps.filter.outputs.mkfs || steps.unfiltered.outputs.mkfs }}
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rust-fs-core at the pinned tag, for code-changed.sh
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^ *FS_CORE_REF: *//p' chores.yml | head -1)"
          git clone --depth 1 --branch "$core_ref" \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - id: code
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: bash scripts/ci-plan.sh
      # The merge queue runs the Windows gate when its group changes
      # format-relevant code; a quick pull request run never does.
      - id: filter
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The code that decides bytes on disk, the workflow that validates
          # them, and the pins of the tools the Windows job runs: the rule
          # and its reasons are scripts/needs-windows-gate.sh, tested by
          # tests/scripts/needs-windows-gate.sh.
          git diff --name-only "$BASE_SHA"...HEAD | sed 's/^/  /'
          if [ "$(bash scripts/needs-windows-gate.sh "$BASE_SHA")" = true ]; then
              echo "mkfs=true" >> "$GITHUB_OUTPUT"
              echo "::notice::this pull request changes format-relevant code, so the Windows chkdsk gate will run"
          else
              echo "mkfs=false" >> "$GITHUB_OUTPUT"
          fi
      # Tags and manual dispatches validate on Windows; pull requests and
      # pushes to main, the quick runs, do not.
      - id: unfiltered
        if: github.event_name != 'merge_group'
        env:
          CODE: ${{ steps.code.outputs.code }}
        run: echo "mkfs=$CODE" >> "$GITHUB_OUTPUT"

  validate-mkfs-windows-run:
    name: Windows chkdsk execution
    runs-on: windows-latest
    # Run 38738194039 at d8d8d9c hit the 40-minute job limit while the CLI
    # matrix was still progressing (12/22 done). Earlier scenarios and builds
    # took 32 minutes before the CLI matrix even started. Allow the expanded
    # oracle suite and trailing chkdsk/round-trip checks to finish, while
    # retaining a finite bound for a hung runner (#388).
    timeout-minutes: 75
    needs: [changes]
    if: needs.changes.outputs.mkfs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: check out sibling repos
        # Replaces `submodules: recursive`. The pins live in chores.yml,
        # so CI and a developer's machine read the same declaration
        # instead of restating it in YAML.
        #
        # chore is fetched from its release tarball at a PINNED version.
        # An unpinned installer would make this workflow's behaviour
        # depend on whatever chore shipped that morning, which is the
        # opposite of what pinning the siblings is for.
        #
        # WINDOWS RUNNERS FALL BACK TO PLAIN CLONES. chore publishes
        # darwin and linux builds only, and `uname -s` under Git Bash
        # reports MINGW64_NT-*, so there is nothing to install. The
        # fallback re-states the pins, which is exactly the duplication
        # `chore siblings` exists to remove -- so it reads them OUT OF
        # chores.yml rather than hardcoding them, and the single
        # declaration still holds.
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }

          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.11.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.11.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.11.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.11.0-darwin-x86_64.tar.gz" ;;
            *)              asset="" ;;   # Windows: no chore build
          esac

          if [ -n "$asset" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/$asset" \
              | sudo tar xz -C /usr/local/bin chore
            chore siblings
          else
            core_ref="$(pin FS_CORE_REF)"
            harness_ref="$(pin HARNESS_REF)"
            echo "chore has no build for $(uname -s); cloning siblings directly"
            echo "  rust-fs-core              $core_ref"
            echo "  fs-windows-test-harness $harness_ref"
            git clone --quiet --depth 1 --branch "$core_ref" \
              https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
            git clone --quiet --depth 1 --branch "$harness_ref" \
              https://github.com/antimatter-studios/fs-windows-test-harness.git ../fs-windows-test-harness
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Install rust-img-vhd
        # Builds the in-house VHD writer (~30 s with no cache). The binary
        # lands in ~/.cargo/bin which is on PATH after
        # dtolnay/rust-toolchain.
        #
        # THE PINS COME FROM chores.yml (#190). This copy once spelled
        # its refs inline and was left behind when the release
        # workflow's moved, so the two jobs built their test images with
        # different versions of the same tool (#387). From v0.6.1 the
        # checkout builds alone, at the dependencies its lockfile names
        # (#462).
        shell: pwsh
        run: |
          $vhd = (Select-String -Path chores.yml -Pattern '^\s*IMG_VHD_REF:\s*(\S+)').Matches[0].Groups[1].Value
          git clone --depth 1 --branch $vhd https://github.com/antimatter-studios/rust-img-vhd.git $env:RUNNER_TEMP/rust-img-vhd
          cargo install --locked --path $env:RUNNER_TEMP/rust-img-vhd --features cli --bin rust-img-vhd
      - name: Make this runner its own Windows VM (sshd, key auth, PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:ProgramFiles\Git\bin\bash.exe" -c 'mkdir -p ~/.ssh && ssh-keygen -t ed25519 -N "" -f ~/.ssh/rust-ntfs-matrix -q'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Get-Content "$env:USERPROFILE\.ssh\rust-ntfs-matrix.pub" | Set-Content -Encoding ascii $keys
          icacls $keys /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell `
            -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -PropertyType String -Force | Out-Null
          Restart-Service sshd
      # What a set of chkdsk passes means, driven with chkdsk's real reports
      # and no VM (#419). Both shells: the matrix runs win-chkdsk.ps1 under
      # Windows PowerShell 5.1 over SSH, a developer runs the test under pwsh.
      - name: Test the chkdsk verdict
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/chkdsk-verdict.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/scripts/chkdsk-verdict.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build rust-ntfs (Windows)
        run: cargo build --release --locked --features harness --bin rust-ntfs
      - name: Validate rmdir matrix scenarios
        shell: bash
        run: |
          bash scripts/run-matrix.sh mac-format-mkdir-rmdir-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      - name: Validate foreign fragmented INDX fixture
        shell: bash
        run: |
          bash scripts/run-matrix.sh foreign-fragmented-indx-512-win-enumerate-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # A file whose streams Windows spread over extension records,
      # unlinked here: chkdsk grades that its extension records and
      # their clusters went with it (#565).
      - name: Validate unlinking a file whose attributes fill extension records
        shell: bash
        run: |
          bash scripts/run-matrix.sh win-format-win-write-streams-mac-delete-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # Streams a file's base record cannot hold, written here: the file
      # gets an $ATTRIBUTE_LIST and extension records, or Windows' own
      # list is kept true. chkdsk grades them and Windows reads every
      # stream back (#480).
      - name: Validate streams written through an attribute list on Windows
        shell: bash
        run: |
          for scenario in mac-format-mac-write-streams-win-chkdsk \
            mac-format-mac-write-big-streams-win-chkdsk \
            win-format-win-write-streams-mac-write-streams-win-chkdsk; do
            bash scripts/run-matrix.sh "$scenario" \
              --vm-host=runneradmin@localhost \
              --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
              --vm-workdir=C:/rust-fs-ntfs-matrix
          done
      # EAs a file's base record cannot hold, or written to a file that has
      # an $ATTRIBUTE_LIST, go through the list. chkdsk grades them and
      # Windows reads every EA back through NtQueryEaFile (#660).
      - name: Validate EAs written through an attribute list on Windows
        shell: bash
        run: |
          for scenario in mac-format-mac-write-streams-mac-write-eas-win-chkdsk \
            win-format-win-write-streams-mac-write-eas-win-chkdsk; do
            bash scripts/run-matrix.sh "$scenario" \
              --vm-host=runneradmin@localhost \
              --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
              --vm-workdir=C:/rust-fs-ntfs-matrix
          done
      # An EA set no record holds resident is kept in clusters, rewritten
      # there as it grows and shrinks, and gives them back when it is
      # removed; chkdsk grades the clusters and Windows reads every EA back
      # through NtQueryEaFile (#661).
      - name: Validate non-resident EAs on Windows
        shell: bash
        run: |
          for scenario in mac-format-mac-write-big-eas-win-chkdsk \
            mac-format-mac-write-big-eas-remove-all-win-chkdsk \
            win-format-win-write-streams-mac-write-big-eas-win-chkdsk; do
            bash scripts/run-matrix.sh "$scenario" \
              --vm-host=runneradmin@localhost \
              --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
              --vm-workdir=C:/rust-fs-ntfs-matrix
          done
      - name: Validate enumeration without required paths on Windows
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips matrix -- bash scripts/run-matrix.sh mac-format-basic-256mib \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # Symlinks given object ids here, on a volume whose $O and $R Windows
      # had already grown past their roots: chkdsk grades that their
      # entries went into Windows' INDX blocks, which split (#571).
      - name: Validate reparse points and object ids put into spilled indexes
        shell: bash
        run: |
          bash scripts/run-matrix.sh win-format-win-write-views-mac-write-views-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # A symbolic link and an object id made here: each has an entry in
      # its $Extend index, and chkdsk grades that it does (#478).
      - name: Validate reparse point and object id indexes on Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh mac-format-mac-symlink-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
          bash scripts/run-matrix.sh mac-format-mac-objid-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # Files whose object ids Windows indexed past $O's root, unlinked
      # here: chkdsk grades that their entries left the index (#571).
      - name: Validate unlinking files with object ids in a spilled index
        shell: bash
        run: |
          bash scripts/run-matrix.sh win-format-win-write-objids-mac-delete-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # A file and a directory Windows charged to their owner with quota
      # tracking on, deleted here: chkdsk grades the volume, and Windows'
      # own recount of each owner's usage must be what $Quota held (#674).
      - name: Validate quota charges given back by deletes on Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh win-format-win-quota-mac-delete-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # A volume Windows journals, written here: Windows must not report
      # the same journal afterwards, which would promise consumers a record
      # of every change that this crate's changes are not in (#479).
      - name: Validate the change journal after a write on Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh win-format-win-usn-journal-mac-write-win-usn-retired-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      - name: Validate routed leaf split on Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh mac-format-mac-split-routed-leaf-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # 1000 names in one directory: the index root fills and hands its
      # entries down a level (#432).
      - name: Validate index root split on Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh mac-format-mac-split-index-root-win-chkdsk \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # Windows' sparse layout is the oracle for this crate's (#512). Windows
      # writes sparse files at four cluster sizes, this crate writes the same
      # content beside them, and the two layouts must agree before chkdsk
      # grades the volume and Windows reads back every file this crate wrote.
      # The substring takes in the two mac-format sparse scenarios as well:
      # chkdsk on a volume this crate formatted and wrote sparse files to.
      - name: Validate sparse files against Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh sparse \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      # The command-line tools' Windows half (the `cli` group): mkfs.ntfs,
      # fs.ntfs set and fsck.ntfs change the image on this runner, and
      # Windows grades it -- chkdsk, fsutil dirty query. chore has no
      # Windows build, so this calls the suite's Windows half directly, as
      # the steps above do.
      - name: Build the command-line tools (Windows)
        run: cargo build --release --locked --features cli --bin rust-fs-ntfs
      - name: Validate the command-line tools on Windows
        shell: bash
        run: |
          bash scripts/run-matrix.sh cli \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/rust-ntfs-matrix)" \
            --vm-workdir=C:/rust-fs-ntfs-matrix
      - name: Capture Windows matrix diagnostics on failure
        if: failure()
        shell: bash
        run: bash scripts/matrix-fetch-diag.sh
      - name: Generate raw image and wrap in GPT-partitioned VHD
        shell: pwsh
        run: |
          pwsh -File scripts/fs-windows-test-harness/ci-make-image.ps1
      - name: Mount VHD and capture pre-chkdsk diagnostics
        id: mount
        shell: pwsh
        # Don't fail the step on individual cmdlet errors — fsutil reports
        # "disk corrupt" via a non-zero exit, which causes pwsh to throw
        # under "Stop" mode. We want to gather every diagnostic regardless.
        continue-on-error: true
        run: |
          pwsh -File scripts/fs-windows-test-harness/ci-mount-and-diagnose.ps1
      - name: Build a reference Microsoft-formatted NTFS volume + diff against ours
        # The whole point of this step is to PROVE which bytes are
        # wrong in our mkfs_ntfs output, not guess. We format an
        # identically-sized volume with Microsoft's own format.exe,
        # then dump the same byte ranges from both. Any difference
        # in the boot sector or first few MFT records is by-definition
        # what mkfs_ntfs got wrong vs. the canonical reference.
        shell: pwsh
        continue-on-error: true
        run: |
          pwsh -File scripts/fs-windows-test-harness/ci-reference-volume.ps1
      - name: chkdsk passes
        id: chkdsk
        shell: pwsh
        # Always run, capture each result separately. NTFS Event 55 in
        # iter3 confirmed the kernel detects corruption on access — we
        # need chkdsk to actually surface what's wrong. /scan failed on
        # 64 MiB due to shadow-copy storage; with the volume bumped to
        # 256 MiB it should run.
        continue-on-error: true
        run: |
          . scripts/fs-windows-test-harness/_verdict.ps1
          $letter = "${{ steps.mount.outputs.letter }}"
          New-Item -ItemType Directory -Path diag -Force | Out-Null
          if (-not $letter) {
              "no drive letter from mount step — skipping chkdsk" |
                  Tee-Object diag/chkdsk-skipped.txt
              "scan_exit=99" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          # Pass 1: plain `chkdsk DRIVE:` — read-only, no /scan, no /F.
          # On a volume already flagged corrupt, this surfaces detailed
          # MFT/index/attribute errors without needing shadow copy.
          $proc1 = Start-Process -FilePath chkdsk.exe `
            -ArgumentList "${letter}:" `
            -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput diag/chkdsk-readonly.txt `
            -RedirectStandardError diag/chkdsk-readonly-stderr.txt
          "chkdsk ${letter}: (read-only) exit: $($proc1.ExitCode)" |
              Tee-Object diag/chkdsk-readonly-exit.txt | Out-Null
          Show-Verdict "chkdsk ${letter}: (read-only)" diag/chkdsk-readonly.txt $proc1.ExitCode

          # Pass 2: `chkdsk /scan` — needs shadow-copy space which now
          # fits in our 256 MiB volume. Different code path than
          # read-only and surfaces additional issues.
          $proc2 = Start-Process -FilePath chkdsk.exe `
            -ArgumentList "${letter}:","/scan" `
            -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput diag/chkdsk-scan.txt `
            -RedirectStandardError diag/chkdsk-scan-stderr.txt
          "chkdsk ${letter}: /scan exit: $($proc2.ExitCode)" |
              Tee-Object diag/chkdsk-scan-exit.txt | Out-Null
          Show-Verdict "chkdsk ${letter}: /scan" diag/chkdsk-scan.txt $proc2.ExitCode

          # The job verdict is the /scan exit code (chkdsk's standard).
          # Read-only + /scan agreement = good signal; disagreement = bug.
          $exit = $proc2.ExitCode
          if ($exit -ne 0) {
            Write-Host "::error::chkdsk /scan reported issues (exit $exit)"
            "chkdsk /scan failed (exit $exit) — see diag/chkdsk-*.txt" `
              | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          "scan_exit=$exit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Round-trip stress (create + read + delete)
        # Even if chkdsk /scan was clean, exercise the volume with real
        # I/O — a malformed $Bitmap or attribute table can pass /scan
        # but blow up on the first write. If this step fails, our mkfs
        # produced a "looks valid but isn't usable" volume.
        #
        # `continue-on-error` STAYS, AND THE `id` IS WHY IT CAN (#207/#276).
        # The deferral is deliberate: a throw here must not stop the
        # post-round-trip scan or the diagnostics upload, because the
        # state of the volume AFTER the failed I/O is the evidence. What
        # was missing is the other half of the deferral — the verdict has
        # to be collected. `id: roundtrip` is what lets the final gate
        # read `steps.roundtrip.outcome`; without it this step's `throw`
        # was swallowed and nothing could ever see it.
        id: roundtrip
        if: steps.chkdsk.outputs.scan_exit == '0'
        shell: pwsh
        continue-on-error: true
        run: |
          $letter = "${{ steps.mount.outputs.letter }}"
          $root = "${letter}:\"
          $tiny = Join-Path $root "tiny.txt"
          $medium = Join-Path $root "medium.bin"
          $big = Join-Path $root "big.bin"
          # Create a few files of varying sizes — covers resident
          # ($DATA in MFT record), small non-resident, and one big
          # enough to allocate multiple clusters. Use raw byte
          # writes (no Out-File encoding nuances) for determinism.
          [System.IO.File]::WriteAllText($tiny, "hello")
          [System.IO.File]::WriteAllBytes($medium, (New-Object byte[] 4096))
          [System.IO.File]::WriteAllBytes($big, (New-Object byte[] (1MB)))
          Get-ChildItem $root | Format-List | Out-File diag/post-write-listing.txt
          # Read back. If $Bitmap allocation lied about which clusters
          # we got, this returns wrong bytes.
          $readback = [System.IO.File]::ReadAllText($tiny)
          if ($readback -ne "hello") { throw "round-trip read mismatch on tiny.txt" }
          # Delete + verify they're gone.
          Remove-Item $tiny, $medium, $big
          $remaining = Get-ChildItem $root -Force | Where-Object { -not $_.PSIsContainer }
          if ($remaining) { throw "files still present after delete" }
          "round-trip OK" | Out-File diag/round-trip.txt
      - name: chkdsk /scan (post round-trip)
        # THE SCAN THAT ACTUALLY SEES A WRITE-PATH REGRESSION (#207/#276).
        # The first scan reads a freshly formatted volume nothing has
        # written to yet; this one reads it after real file I/O, so it is
        # the one that notices a $Bitmap or attribute table that only
        # corrupts itself under use. It reports its exit code the same way
        # the first scan does — `scan_exit` on this step's outputs — so
        # the final gate can name which scan failed rather than inferring.
        id: chkdsk_after
        if: steps.chkdsk.outputs.scan_exit == '0'
        shell: pwsh
        continue-on-error: true
        run: |
          $letter = "${{ steps.mount.outputs.letter }}"
          $log = "diag/chkdsk-scan-after-roundtrip.txt"
          $proc = Start-Process -FilePath chkdsk.exe `
            -ArgumentList "${letter}:","/scan" `
            -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput $log
          $exit = $proc.ExitCode
          $n = if (Test-Path $log) { (Get-Content $log).Count } else { 0 }
          Write-Host "chkdsk /scan (post round-trip): exit $exit ($n lines) -- $log"
          if ($exit -ne 0 -and (Test-Path $log)) {
              Write-Host "--- last 40 lines of $log ---"
              Get-Content $log -Tail 40
          }
          "chkdsk-after-roundtrip exit: $exit" | Out-File diag/chkdsk-exit-after.txt
          if ($exit -ne 0) {
            Write-Host "::error::chkdsk /scan after the round-trip reported issues (exit $exit) — the volume was well-formed at creation and is not now"
            "post-round-trip chkdsk /scan failed (exit $exit) — see diag/chkdsk-scan-after-roundtrip.txt" `
              | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          "scan_exit=$exit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Dismount
        if: always()
        shell: pwsh
        run: |
          Dismount-DiskImage -ImagePath "$pwd\wrapper.vhd" -ErrorAction SilentlyContinue | Out-Null
      - name: Upload diagnostics
        # Always upload — successful runs also benefit from having the
        # baseline metadata captured for cross-commit comparison.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-windows-diag-${{ github.run_id }}
          path: |
            diag/
            test-diagnostics/matrix/
          if-no-files-found: warn
      - name: Fail the job if chkdsk or the round-trip found issues
        # We deferred failure earlier (continue-on-error) so the
        # artifact upload always fires. Fail the job here once
        # everything is captured.
        #
        # THE DEFERRAL HAS TO COLLECT EVERY VERDICT, NOT ONE (#207/#276).
        # This read `steps.chkdsk.outputs.scan_exit` alone — the scan
        # taken BEFORE any I/O. The round-trip's `throw` and the
        # post-round-trip scan's exit code were written to diag/ and
        # discarded, so a volume that is well-formed at creation and then
        # returns wrong bytes, refuses a delete, or corrupts itself under
        # file I/O produced a green tick. In release.yml that tick is the
        # last thing between a tag and crates.io.
        #
        # A skipped step's `outcome` is `skipped`, not `success`, so when
        # the first scan fails and the two later steps do not run, the
        # clauses below all fire and the first one names the real cause.
        # That is why the body reports each verdict rather than throwing
        # a single message.
        if: >-
          steps.chkdsk.outputs.scan_exit != '0' ||
          steps.roundtrip.outcome != 'success' ||
          steps.chkdsk_after.outcome != 'success' ||
          steps.chkdsk_after.outputs.scan_exit != '0'
        shell: pwsh
        run: |
          $failures = @()
          if ($env:scan_exit -ne '0') {
            $failures += "chkdsk /scan (pre round-trip) exit code was $($env:scan_exit)"
          }
          if ($env:roundtrip_outcome -ne 'success') {
            $failures += "round-trip stress outcome was $($env:roundtrip_outcome) (create + read + delete on the mounted volume)"
          }
          if ($env:chkdsk_after_outcome -ne 'success' -or $env:chkdsk_after_exit -ne '0') {
            $failures += "chkdsk /scan (post round-trip) outcome was $($env:chkdsk_after_outcome), exit code '$($env:chkdsk_after_exit)'"
          }
          $failures | ForEach-Object { Write-Host "::error::$_" }
          throw "Windows validation failed: $($failures -join '; ') — see uploaded diag/ artifact"
        env:
          scan_exit: ${{ steps.chkdsk.outputs.scan_exit }}
          roundtrip_outcome: ${{ steps.roundtrip.outcome }}
          chkdsk_after_outcome: ${{ steps.chkdsk_after.outcome }}
          chkdsk_after_exit: ${{ steps.chkdsk_after.outputs.scan_exit }}

  # THE COMMAND-LINE TOOLS, AS INSTALLED. The multi-call binary is built in
  # release mode and staged by `chore cli:install` under every name it
  # answers to, first on PATH; `chore test:cli` then runs `rust-fs-ntfs
  # doctor` and tests/cli/*.sh against whatever PATH finds -- the program a
  # user would run, not a cargo target. A change that breaks a tool fails the
  # pull request, not the release.
  #
  # The same job builds the release tarball with rust-fs-core's package-cli,
  # run in place from ../rust-fs-core as core's release-cli workflow runs it at a
  # release, and lets it check its own layout (the binary, a relative
  # symlink per dotted name, the man pages and completions, the CAVEATS and
  # the licences, every name answering --version as this crate), so a
  # release is never the first time the tarball is put together. What ships
  # is Cargo.toml's [package.metadata.package-cli].
  #
  # `test:cli:oracle` then holds the tools to something that is not us:
  # volumes Windows wrote, with the SHA-256 and link targets Windows itself
  # reported (tests/cli-oracle/).
  cli:
    name: cli (the installed tools, on PATH)
    runs-on: ubuntu-latest
    # The Windows-authored volumes are the oracle for the read verbs
    # (tests/cli-oracle/); only a Windows runner can make them.
    needs: [windows-native-read-fixtures]
    steps:
      - uses: actions/checkout@v4
      - name: Install chore and check out sibling repos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/chore-0.11.0-linux-x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cli-cargo-${{ hashFiles('**/Cargo.lock') }}
      # man-db: tests/cli/test-docs.sh finds each page with `man -w`, from
      # PATH, as a user would. ntfs-3g: its own tools read what fs.ntfs
      # wrote (tests/cli-oracle/test-ntfs3g.sh), a second, independent
      # reader beside Windows.
      - name: Install man-db and ntfs-3g
        run: |
          sudo apt-get update
          sudo apt-get install -y man-db ntfs-3g
      - name: chore cli:install
        run: chore cli:install
      # FIRST on PATH, so a distribution's mkfs.ntfs later on PATH is the one
      # doctor reports as present and not run.
      - name: The staged tools first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: chore test:cli
        id: tier
        run: chore test:cli
      # The host half of the Windows matrix's cli scenarios, without the VM:
      # a break in it used to show only in the Windows job, ten minutes in
      # (#546). Windows still grades the images there.
      - name: chore test:cli:host
        run: chore test:cli:host
      - name: Download Windows-authored native read fixtures
        uses: actions/download-artifact@v4
        with:
          name: ntfs-windows-native-read-fixtures
          path: test-disks
      # Volumes Windows formatted and wrote, read by the installed fs.ntfs
      # and compared with the hashes and link targets Windows reported; and
      # volumes fs.ntfs wrote, read by ntfs-3g.
      - name: chore test:cli:oracle
        id: oracle
        run: chore test:cli:oracle
      - name: The release tarball, packaged and its layout checked
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p tmp/package
          cd tmp/package
          tarball="$(bash ../../../rust-fs-core/scripts/package-cli.sh "$version" linux-x86_64 ../../target/release | tail -n 1)"
          tar -tvzf "$tarball"
      - name: Keep the tier log
        # Not before the tier ran: there is no log then, and this step's red
        # would hide the real one.
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-cli
          path: tmp/logs/*.log
          if-no-files-found: error

  kernel:
    # `chore test:kernel`: Linux's ntfs3 mounts what this crate wrote and
    # writes what this crate must read, in the fs-linux-test-harness VM
    # (#486). A third NTFS implementation beside Windows and ntfs-3g. Only
    # an x86_64 runner has KVM; ci-setup-linux.sh is the harness's one setup
    # for it, run from the sibling checkout as every consumer does.
    name: kernel oracle (Linux ntfs3, harness VM, x86_64 KVM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install chore and check out sibling repos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/chore-0.11.0-linux-x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-kernel-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: chore test:kernel
        id: tier
        run: chore test:kernel
      # The tier runs in a harness session, which takes the VM down however
      # it ends; a VM still up here would hold the machine's slot.
      - name: The VM is down again
        if: always() && steps.tier.outcome != 'skipped'
        run: '! chore linux:status'
      - name: Keep the tier log
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-kernel
          path: tmp/logs/*.log
          if-no-files-found: error

  # Keep the existing required-check name while making an intentional Windows
  # skip report as success. A failed or missing run must report failure.
  semver:
    # `chore check:semver`: this tree's public API against the newest version
    # on crates.io, refusing a break the version in Cargo.toml does not
    # declare (#399). No fixtures, no VM -- only the registry.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version ../rust-fs-core/scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
      - name: Install chore and check out sibling repos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/chore-0.11.0-linux-x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-semver-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: chore check:semver
        run: chore check:semver

  validate-mkfs-windows:
    name: validate rust-ntfs format (Windows chkdsk)
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, validate-mkfs-windows-run]
    steps:
      - uses: actions/checkout@v4
      - name: Check the Windows verdict
        env:
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci-verdict.sh windows

  # ASan stays advisory: it is deliberately not a dependency here, and it
  # carries `continue-on-error: true` to say so where ci-gate can read it.
  # `windows-native-read-fixtures` is needed directly rather than only
  # through `integration`, so dropping it from `integration`'s needs cannot
  # take it out of the gate (#409).
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs: [readonly-file-name, test, windows-native-read-fixtures, integration, changes, validate-mkfs-windows, cli, kernel, semver, interrupted-bootstrap, python-abi, python-volume-info-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Check every gating job
        env:
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
          # false only for a quick run (a pull request or a push to main):
          # then, and only then, a full job's skip is not a failed one.
          CODE: ${{ needs.changes.outputs.code }}
        run: bash scripts/ci-verdict.sh aggregate
