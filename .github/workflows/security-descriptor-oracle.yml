name: Security descriptor Windows oracle
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descriptor-oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rust-fs-core at the sibling pin
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^  FS_CORE_REF: *//p' chores.yml | tr -d '\r')"
          git clone --quiet --depth 1 --branch "$core_ref" \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Compare Windows-authored descriptor headers and SIDs
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
          NTFS_SD_CAPTURE: security-descriptor-windows.tsv
        run: |
          set -euo pipefail
          bash ../rust-fs-core/scripts/tier.sh --refuse-skips --refuse-ignored unit -- cargo test --locked --test security_descriptor_windows_oracle
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' tmp/logs/unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-descriptor-windows-${{ github.sha }}
          path: |
            security-descriptor-windows.tsv
            tmp/logs/unit.log
          if-no-files-found: error
