name: Windows format geometry capture
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
# A new head cancels this workflow's obsolete runs of the same pull request.
# Every other run has a group of its own, so main pushes, merge groups,
# scheduled and manual runs, and `red:` evidence are never cancelled or
# replaced (#1360). tests/scripts/ci-concurrency.sh holds this block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && !startsWith(github.head_ref, 'red/') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && !startsWith(github.head_ref, 'red/') }}

permissions:
  contents: read
jobs:

  geometry-capture-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick windows-x64

  geometry-capture:
    needs: geometry-capture-gate
    runs-on: ${{ needs.geometry-capture-gate.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fixture-free decoding and coverage contracts (76 checks)
        shell: pwsh
        run: ./tests/scripts/windows-format-geometry.ps1
      - name: Capture all 26 Windows format requests, six large-cluster layouts and their index VCN units
        shell: pwsh
        run: ./test-disks/capture-format-geometry.ps1
      - name: Capture Windows' own NTFS format of a 4096-byte-sector disk
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./test-disks/capture-sector-geometry.ps1
      - name: Capture Windows' own NTFS format of a 512e disk beside a 512n disk
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./test-disks/capture-512e-geometry.ps1
      # The smallest volume Windows formats as NTFS at 4 KiB clusters, with
      # its $LogFile size and $MFTMirr position, which mkfs's small-volume
      # policy is written against (#961).
      - name: Capture the smallest NTFS volume Windows formats at 4 KiB clusters
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./test-disks/capture-small-volume-geometry.ps1
      - name: No generated image survives capture
        if: always()
        shell: pwsh
        run: |
          if (Get-ChildItem tmp/format-geometry -File -ErrorAction SilentlyContinue |
              Where-Object Extension -in '.vhd', '.vhdx') {
            throw 'a scratch geometry VHD or VHDX survived cleanup'
          }
      - name: Retain native measurements and provenance, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-geometry-${{ github.sha }}
          path: |
            tmp/format-geometry/*.json
            tmp/format-geometry/*.txt
          if-no-files-found: error
