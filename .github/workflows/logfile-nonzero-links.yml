name: LogFile nonzero links

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A new head cancels this workflow's obsolete runs of the same pull request.
# Every other run has a group of its own, so main pushes, merge groups,
# scheduled and manual runs, and `red:` evidence are never cancelled or
# replaced (#1360). tests/scripts/ci-concurrency.sh holds this block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && !startsWith(github.head_ref, 'red/') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && !startsWith(github.head_ref, 'red/') }}

permissions:
  contents: read

jobs:

  nonzero-links-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  nonzero-links:
    name: immutable Windows nonzero link evidence
    needs: nonzero-links-gate
    runs-on: ${{ needs.nonzero-links-gate.outputs.runner }}
    timeout-minutes: 8
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: C toolchain for the gated runner
        if: runner.environment == 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Require independent nonzero link comparisons
        run: cargo test --locked --manifest-path scripts/logfile-record-oracle/Cargo.toml --test nonzero_links -- --nocapture
      - name: Retain independent Windows link evidence and refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logfile-nonzero-links
          path: |
            tmp/logfile-nonzero-links/*.tsv
            tmp/logfile-nonzero-links/*.txt
            tmp/logfile-nonzero-links/*.stderr
          if-no-files-found: error
