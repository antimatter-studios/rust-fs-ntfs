name: Focused Python directory ABI

on:
  pull_request:
  workflow_dispatch:

# A new head cancels this workflow's obsolete runs of the same pull request.
# Every other run has a group of its own, so main pushes, merge groups,
# scheduled and manual runs, and `red:` evidence are never cancelled or
# replaced (#1360). tests/scripts/ci-concurrency.sh holds this block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && !startsWith(github.head_ref, 'red/') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && !startsWith(github.head_ref, 'red/') }}

permissions:
  contents: read

jobs:

  directory-abi-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  directory-abi:
    needs: directory-abi-gate
    runs-on: ${{ needs.directory-abi-gate.outputs.runner }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install the reference reader and C toolchain
        run: |
          packages=(ntfs-3g)
          # The gated runner image has no C toolchain; the hosted image does.
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            packages+=(build-essential)
          fi
          bash scripts/apt-ubuntu.sh "${packages[@]}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - run: nice -n 10 cargo rustc --profile test-opt --locked --lib --crate-type cdylib
      - run: cc -std=c11 -Wall -Werror -Iinclude tests/python/abi_dir_listing.c -Ltarget/test-opt -lfs_ntfs -Wl,-rpath,"$PWD/target/test-opt" -o target/abi_dir_listing
      - run: gunzip -c test-disks/windows-interrupted-1.recovered.img.gz > target/python-abi.img
      - name: Record the exact checkout and reference version
        # ntfsls --version prints its banner and exits 1 by design, so the
        # package manager names the exact ntfs-3g build instead.
        run: |
          git rev-parse HEAD
          dpkg-query -W -f='${Package} ${Version}\n' ntfs-3g
      - name: Compare raw metadata, host visibility, Python and C
        env:
          FS_NTFS_SHARED_LIB: ${{ github.workspace }}/target/test-opt/libfs_ntfs.so
          FS_NTFS_DIR_PROBE: ${{ github.workspace }}/target/abi_dir_listing
          FS_NTFS_FIXTURE: ${{ github.workspace }}/target/python-abi.img
        run: python3 -m unittest -v tests/python/test_dir_listing.py
